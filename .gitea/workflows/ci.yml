name: CI

on:
  pull_request:
    branches: [main, dev]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

jobs:
  static:
    name: Static checks
    runs-on: factorio-headless
    env:
      FACTORIO_BIN: /opt/factorio/bin/x64/factorio

    steps:
      - name: Check out repository
        env:
          CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKOUT_REPOSITORY: ${{ github.repository }}
          GITEA_SERVER_URL: ${{ github.server_url }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          git --version
          git init .
          git remote add origin "$GITEA_SERVER_URL/$CHECKOUT_REPOSITORY.git"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.extraHeader \
          GIT_CONFIG_VALUE_0="Authorization: token $GITEA_TOKEN" \
            git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git checkout --force FETCH_HEAD
          git rev-parse HEAD

      - name: Verify validation environment
        run: |
          set -eux
          git --version
          bash --version
          python3 --version
          python3 -c "import yaml; print('pyyaml available')"
          luac -v
          rg --version
          file "$FACTORIO_BIN"
          "$FACTORIO_BIN" --version

      - name: Metadata, changelog, unit tests, Lua syntax
        env:
          AFI_SKIP_FACTORIO: "1"
        run: ./scripts/validate.sh

  load:
    # One job per load shape, so a failure in one does not stop the others from
    # running and reporting. The runner takes one job at a time, so they still
    # run in sequence; they gain independence and their own result now, and
    # concurrency once the runner has capacity for it.
    #
    # No ${{ matrix.test }} in the name: Gitea does not interpolate job names and
    # appends the matrix value itself, e.g. "Factorio load test (space-age)".
    name: Factorio load test
    needs: static
    runs-on: factorio-headless
    strategy:
      fail-fast: false
      matrix:
        # Listed here rather than computed: Gitea creates a run's jobs before any
        # job has output to read. Each name is a case in scripts/ci-load-test.sh.
        test:
          - base-game
          - space-age
          - mod-family
          - full-dependencies
          - full-dependencies-with-parameters
    env:
      FACTORIO_BIN: /opt/factorio/bin/x64/factorio

    steps:
      - name: Check out repository
        env:
          CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKOUT_REPOSITORY: ${{ github.repository }}
          GITEA_SERVER_URL: ${{ github.server_url }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          git --version
          git init .
          git remote add origin "$GITEA_SERVER_URL/$CHECKOUT_REPOSITORY.git"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.extraHeader \
          GIT_CONFIG_VALUE_0="Authorization: token $GITEA_TOKEN" \
            git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git checkout --force FETCH_HEAD
          git rev-parse HEAD

      - name: Verify validation environment
        run: |
          set -eux
          git --version
          bash --version
          python3 --version
          python3 -c "import yaml; print('pyyaml available')"
          luac -v
          rg --version
          file "$FACTORIO_BIN"
          "$FACTORIO_BIN" --version

      - name: Run load test
        env:
          TEST: ${{ matrix.test }}
          FACTORIO_MOD_PORTAL_USERNAME: ${{ secrets.FACTORIO_MOD_PORTAL_USERNAME }}
          FACTORIO_MOD_PORTAL_TOKEN: ${{ secrets.FACTORIO_MOD_PORTAL_TOKEN }}
        run: ./scripts/ci-load-test.sh "$TEST"

  gate:
    # Keeps the check name branch protection already requires, reporting one
    # pass/fail for the static checks and every load test together.
    name: "Gate: Validate Factorio mod"
    needs: [static, load]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require the static checks and every load test to pass
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          LOAD_RESULT: ${{ needs.load.result }}
        run: |
          set -eu
          echo "static checks: $STATIC_RESULT"
          echo "load tests:    $LOAD_RESULT"
          test "$STATIC_RESULT" = success
          test "$LOAD_RESULT" = success
