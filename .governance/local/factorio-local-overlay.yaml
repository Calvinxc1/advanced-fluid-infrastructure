  json: true
  lua_syntax: true
  lint: false
  format: false
  factorio_load: true
workspace_specific_rules:
  - "Krastorio 2 is an optional dependency (? Krastorio2). Under K2 this mod's tier stats carry, while K2's recipes, ingredients and technology unlocks are followed, with one unlock per recipe. K2's steel pipe, steel pipe to ground and steel pump are the steel tier (afi_steel-pipe, -pipe-to-ground and -pump are removed and the steel techs fold into kr-steel-fluid-handling); every tier above iron joins K2's kr-steel-pipe connection category; offshore pump tiers copy the vanilla offshore pump's final power source. Jason set this direction on 2026-09-25, built on the non-Space-Age path. See src/prototypes/fluid/krastorio2.lua."
  - "Oil gathering waits on the whole steel tier, pipes and pumps (Jason, 2026-09-25): this mod's steel piping and steel pumping without K2, K2's steel fluid handling with it. That keeps the Space Age Vulcanus branch's calcite-lined pumps, built from steel pumps, craftable when they unlock."
  - "Under Krastorio 2 the tier values stay as balanced for the base game (60/240/360/600 pumping). Jason wants players to struggle at points and feel things ease as they progress, so do not strengthen mid tiers for K2. Late-game headroom comes from the foundation (1200/s) and high-pressure foundation (3600/s) tiers, which K2 without Space Age builds from K2 materials (src/prototypes/fluid/krastorio2-foundation.lua). Pump and offshore pump power under K2 is base * (speed / base_speed)^1.5."
  - "Krastorio 2 Spaced Out (? Krastorio2-spaced-out) on Factorio 2.1 requires Krastorio2 and Space Age and loads on top of them; its 2.0-era releases were a standalone alternative declaring ! Krastorio2, which is why it is easy to remember as mutually exclusive. Under Spaced Out this mod runs its K2 integration plus its Space Age tiers; Spaced Out's foundry casting of kr-steel-pipe replaces this mod's afi_casting-steel-pipe and afi_steel-pipe-casting. Verified 2026-09-25 against Spaced Out 2.0.17."
  - "Space Exploration (? space-exploration): SE's space pipes are the space branch (low_pressure_steel stats) with foundation above them. Foundation's recipes come from K2 materials under SE with K2 and from SE materials under SE alone (heavy composite, superconductive cable, holmium solenoid at tier 3; quantum processor, naquium plate at deep space 3), with SE-scale research counts (400 / 1000) and packs inherited from the SE techs they follow. Under SE, pipe, pipe to ground and pump stay in SE's pipe row because SE's blueprint converter swaps ground and space entities within a row. The pump power curve applies wherever the vanilla offshore pump is electric (K2, or AAI under SE). Foundation stays ground-only on the main reinforced upgrade path. Factorio requires an upgrade target to share its source's collision mask and SE gives space-capable pipes their own, so space gets standalone afi_space-foundation-pipe(-to-ground) variants outside every upgrade chain. Jason chose this on 2026-09-25: follow the main upgrade path; treat the space variant as a side variant. The CI downloader skips optional dependencies incompatible with a built-in (SE declares ! space-age)."
  - Run ./scripts/validate.sh for full local validation when luac, Python, and Factorio validation prerequisites are available.
  - Factorio load validation requires FACTORIO_BIN or a discoverable Factorio binary and a mods-directory symlink from the mod name to src.
  - Use src/info.json as the release version source of truth; main deployment creates Gitea and GitHub releases and uploads the packaged mod zip to the Factorio mod portal when that version changes on main, with retry behavior for missing public release destinations after a partially failed release.
  - Follow docs/semantic-versioning.md before changing src/info.json or preparing release work.
  - Use dev as the long-lived integration branch and main as the release branch.
  - Use feature/* branches from dev for day-to-day implementation; merge feature branches back to dev.
  - Promote dev to main through short-lived release/* branches; do not open recurring dev-to-main pull requests.
  - Use hotfix/* branches from main for urgent release-line fixes, then sync hotfix results back to dev and any active release branch that needs the fix.
  - Keep the top src/changelog.txt Version entry synchronized with src/info.json; scripts/validate.sh enforces this.
  - Keep prototype and locale names under the afi_ prefix unless Jason explicitly approves a namespace migration.
migration_notes:
  - Previous local governance branch was coding-agent with canon coding-agent/1.0.0 and generalized canon trunk/2.7.0.
  - Source branch templates were used only as templates; no top-level lab-governance directory was created.
notes: Local facts are based on src/info.json, README.md, CONTRIBUTING.md, docs/semantic-versioning.md, docs/release-process.md, scripts/validate.sh, scripts/factorio-validate.sh, and existing governance migration evidence.
